name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and test
        run: ./gradlew build --stacktrace
      - name: Performance
        run: ./gradlew perfTest --stacktrace
      - name: Report performance
        if: always()
        run: |
          if [ -f build/perf/results.txt ]; then
            while IFS= read -r line; do echo "::notice title=perf::$line"; done < build/perf/results.txt
            { echo '### Search performance'; echo; sed 's/^/- /' build/perf/results.txt; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Report test failures
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob("build/test-results/*/*.xml"):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for failure in list(case.iter("failure")) + list(case.iter("error")):
                      message = (failure.get("message") or failure.text or "").replace("\n", " ")[:600]
                      print(f"::error title={case.get('classname')}::{case.get('name')}: {message}")
          EOF
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 180 ephemeris
      - name: Call GetInfo from a client container
        run: |
          if ! out=$(docker compose run --rm -T grpcurl 2>&1) || ! echo "$out" | grep -q '"engineVersion": "Swiss Ephemeris 2.10'; then
            echo "$out"
            echo "$out" | tail -n 8 | sed 's/^/::error title=grpcurl::/'
            exit 1
          fi
          echo "$out"
          echo "::notice title=docker::$(docker image inspect swiss-ephemeris-service:local --format '{{.Size}}' | awk '{printf "image %.0f MB", $1/1000000}')"
      - name: Container logs
        if: failure()
        run: |
          docker compose logs --no-log-prefix ephemeris
          docker compose logs --no-log-prefix ephemeris | tail -n 10 | sed 's/^/::error title=container::/'
      - name: Stop
        if: always()
        run: docker compose down
