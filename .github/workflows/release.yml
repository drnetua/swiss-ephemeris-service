name: Release

# Publishing a GitHub release (tag vX.Y.Z) builds, tests and attaches:
#   swiss-ephemeris-service-linux-amd64.tar.gz, swiss-ephemeris-service-linux-arm64.tar.gz, SHA256SUMS
# Each archive holds the application (bin/, lib/), libswe for that platform (native/), the .se1 files (ephe/),
# LICENSE and README.md; bin/swiss-ephemeris-service finds native/ and ephe/ by itself and needs a JRE 25.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      - name: Version from the tag
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="${tag#v}"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$' || { echo "::error::tag $tag is not vX.Y.Z"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build, test and assemble
        run: ./gradlew build installDist -PreleaseVersion="$VERSION" --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: build/install/swiss-ephemeris-service/

  package:
    needs: app
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - name: Build libswe and the ephemeris files
        run: sh native/build-libswe.sh "$RUNNER_TEMP/native"
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: pkg/swiss-ephemeris-service
      - name: Assemble the archive
        run: scripts/package-release.sh ${{ matrix.arch }} pkg/swiss-ephemeris-service "$RUNNER_TEMP/native" .
      - name: Smoke test the archive
        run: scripts/smoke-archive.sh swiss-ephemeris-service-linux-${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.arch }}
          path: swiss-ephemeris-service-linux-${{ matrix.arch }}.tar.gz

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum swiss-ephemeris-service-linux-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          gh release upload "${{ github.event.release.tag_name }}" swiss-ephemeris-service-linux-*.tar.gz SHA256SUMS \
            --clobber --repo "${{ github.repository }}"

  docker:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the release image with compose and start it
        env:
          RELEASE: download/${{ github.event.release.tag_name }}
        run: docker compose up -d --build --wait --wait-timeout 180 ephemeris
      - name: Check the running version
        run: |
          tag="${{ github.event.release.tag_name }}"
          out=$(docker compose run --rm -T grpcurl 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          echo "$out" | grep -qE "\"(service_version|serviceVersion)\": \"${tag#v}\"" || { echo "::error::GetInfo does not report ${tag#v}"; exit 1; }
      - name: Stop
        if: always()
        run: docker compose down
